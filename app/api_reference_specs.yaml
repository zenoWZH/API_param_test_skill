  # Vertex vs AI Studio fingerprint suite. Select this reference to judge whether
  # a reseller/gateway Gemini channel is backed by Vertex AI.
  # Pass pattern: usageMetadata.trafficType present; labels accepted; body
  # serviceTier does not surface as AI Studio serviceTier.
  gemini_vertex_generate_content:
    label: "Gemini Vertex GenerateContent (source fingerprint)"
    model_family: gemini
    api_form: gemini_generate_content
    route_profile: google_vertex
    official_sources:
      - "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-reference/inference"
      - "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/multimodal/add-labels-to-api-calls"
      - "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo"
      - "https://ai.google.dev/gemini-api/docs/migrate-to-cloud"
    families:
      - "gemini"
    params:
      contents: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection and endpoint path" }
      usageMetadata.trafficType: { coverage: "gemini_vertex_traffic_type; Vertex response fingerprint (AI Studio uses serviceTier instead)" }
      labels: { coverage: "gemini_vertex_labels; Vertex-only billing/metadata field" }
      serviceTier: { coverage: "gemini_vertex_service_tier_body; body field is AI Studio; Vertex ignores or rejects — expect trafficType, not serviceTier" }
      header.X-Vertex-AI-LLM-Request-Type: { coverage: "gemini_vertex_request_type_header; Vertex PayGo routing header" }
      header.X-Vertex-AI-LLM-Shared-Request-Type: { coverage: "gemini_vertex_shared_request_type_header; Vertex Flex/Priority PayGo header" }
    test_profiles:
      - "gemini_vertex_traffic_type"
      - "gemini_vertex_labels"
      - "gemini_vertex_service_tier_body"
      - "gemini_vertex_request_type_header"
      - "gemini_vertex_shared_request_type_header"

