reference_sources:
  openai_chat_base:
    label: "GPT baseline over OpenAI Chat Completions"
    model_family: gpt
    api_form: openai_chat_completions
    route_profile: vendor_direct
    official_sources:
      - "https://platform.openai.com/docs/api-reference/chat/create"
    default_for_families:
      - "gpt"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "basic_stream / stream_with_usage" }
      stream_options.include_usage: { coverage: "stream_with_usage" }
      temperature: { coverage: "sampling_non_thinking" }
      top_p: { coverage: "sampling_non_thinking" }
      max_tokens: { coverage: "json_output / tool_calls / tool_choice_required" }
      stop: { coverage: "stop_sequences" }
      response_format: { coverage: "json_output" }
      tools: { coverage: "tool_calls / tool_choice_required" }
      tool_choice: { coverage: "tool_choice_required" }
    test_profiles:
      - "basic_stream"
      - "stream_with_usage"
      - "sampling_non_thinking"
      - "json_output"
      - "stop_sequences"
      - "tool_calls"
      - "tool_choice_required"

  # The wire shape is OpenAI-compatible, but the model contract belongs to Kimi.
  kimi_openai_compat:
    label: "Kimi OpenAI-compatible Chat Completions"
    model_family: kimi
    api_form: openai_chat_completions
    route_profile: vendor_direct
    evidence: family_contract_unverified
    official_sources:
      - "https://platform.moonshot.ai/docs/api/chat"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "basic_stream / stream_with_usage" }
      stream_options.include_usage: { coverage: "stream_with_usage" }
      temperature: { coverage: "sampling_non_thinking" }
      top_p: { coverage: "sampling_non_thinking" }
      max_tokens: { coverage: "json_output / tool_calls / tool_choice_required" }
      stop: { coverage: "stop_sequences" }
      response_format: { coverage: "json_output" }
      tools: { coverage: "tool_calls / tool_choice_required" }
      tool_choice: { coverage: "tool_choice_required" }
    test_profiles:
      - "basic_stream"
      - "stream_with_usage"
      - "sampling_non_thinking"
      - "json_output"
      - "stop_sequences"
      - "tool_calls"
      - "tool_choice_required"

  minimax_openai_compat:
    label: "MiniMax OpenAI-compatible Chat Completions"
    model_family: minimax
    api_form: openai_chat_completions
    route_profile: vendor_direct
    evidence: family_contract_unverified
    official_sources:
      - "https://platform.minimaxi.com/document/ChatCompletion%20v2"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "basic_stream / stream_with_usage" }
      stream_options.include_usage: { coverage: "stream_with_usage" }
      temperature: { coverage: "sampling_non_thinking" }
      top_p: { coverage: "sampling_non_thinking" }
      max_tokens: { coverage: "json_output / tool_calls / tool_choice_required" }
      stop: { coverage: "stop_sequences" }
      response_format: { coverage: "json_output" }
      tools: { coverage: "tool_calls / tool_choice_required" }
      tool_choice: { coverage: "tool_choice_required" }
    test_profiles:
      - "basic_stream"
      - "stream_with_usage"
      - "sampling_non_thinking"
      - "json_output"
      - "stop_sequences"
      - "tool_calls"
      - "tool_choice_required"

  # Kimi K3 is OpenAI wire-compatible but not a generic OpenAI model contract.
  # Keep its always-thinking, preserved-history, dynamic-tool and immutable
  # parameter probes together so every vendor is compared against Moonshot's
  # official K3 verifier rather than the generic Chat Completions surface.
  kimi_k3_openai_compat:
    label: "Kimi K3 OpenAI-compatible Chat Completions"
    model_family: kimi
    api_form: openai_chat_completions
    route_profile: vendor_direct
    official_sources:
      - "https://github.com/MoonshotAI/Kimi-K3#6-model-usage"
      - "https://platform.kimi.ai/docs/api/chat"
      - "https://github.com/MoonshotAI/Kimi-Vendor-Verifier"
      - "https://github.com/MoonshotAI/Kimi-Vendor-Verifier/tree/main/tests/k3_features"
      - "https://github.com/MoonshotAI/Kimi-Vendor-Verifier/tree/main/tests/params"
    families:
      - "kimi"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "kimi_k3_stream / kimi_k3_stream_usage" }
      stream_options.include_usage: { coverage: "kimi_k3_stream_usage" }
      temperature: { coverage: "all profiles; fixed to 1.0 except kimi_k3_reject_temperature" }
      top_p: { coverage: "all profiles; fixed to 0.95 except kimi_k3_reject_top_p" }
      max_completion_tokens: { coverage: "all profiles" }
      reasoning_effort: { coverage: "all profiles; explicit low/high/max, with max used by non-effort probes" }
      response.reasoning_content: { coverage: "kimi_k3_stream / kimi_k3_stream_usage / kimi_k3_reasoning_low / kimi_k3_reasoning_high / kimi_k3_reasoning_max / kimi_k3_preserved_thinking / kimi_k3_prompt_cache_key / kimi_k3_dynamic_tools" }
      messages[].reasoning_content: { coverage: "kimi_k3_preserved_thinking" }
      prompt_cache_key: { coverage: "kimi_k3_prompt_cache_key" }
      messages[].tools: { coverage: "kimi_k3_dynamic_tools; non-standard dynamic tool declaration on an empty system message" }
      tool_choice: { coverage: "kimi_k3_dynamic_tools; official values auto|none|required" }
      presence_penalty: { coverage: "kimi_k3_reject_presence_penalty; must remain 0" }
      frequency_penalty: { coverage: "kimi_k3_reject_frequency_penalty; must remain 0" }
      n: { coverage: "kimi_k3_reject_n; must remain 1" }
    test_profiles:
      - "kimi_k3_stream"
      - "kimi_k3_stream_usage"
      - "kimi_k3_reasoning_low"
      - "kimi_k3_reasoning_high"
      - "kimi_k3_reasoning_max"
      - "kimi_k3_preserved_thinking"
      - "kimi_k3_prompt_cache_key"
      - "kimi_k3_dynamic_tools"
      - "kimi_k3_reject_temperature"
      - "kimi_k3_reject_top_p"
      - "kimi_k3_reject_presence_penalty"
      - "kimi_k3_reject_frequency_penalty"
      - "kimi_k3_reject_n"

  # GPT-5.x Chat Completions: classic stop/temperature probes are intentionally omitted.
  # Official reasoning models reject stop; several reject non-default temperature.
  # Function tools on Chat Completions: omit reasoning_effort (official also accepts none;
  # some NewAPI proxies reject the field entirely when tools are present).
  openai_gpt5_chat:
    label: "OpenAI GPT-5.x Chat Completions"
    model_family: gpt
    api_form: openai_chat_completions
    route_profile: vendor_direct
    official_sources:
      - "https://platform.openai.com/docs/api-reference/chat/create"
      - "https://developers.openai.com/api/docs/guides/reasoning"
      - "https://developers.openai.com/api/docs/guides/migrate-to-responses"
    families:
      - "gpt"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "gpt5_chat_stream / gpt5_chat_stream_usage" }
      stream_options.include_usage: { coverage: "gpt5_chat_stream_usage" }
      max_completion_tokens: { coverage: "gpt5_chat_max_completion_tokens / gpt5_chat_reasoning_low / gpt5_chat_json / gpt5_chat_tools" }
      reasoning_effort: { coverage: "gpt5_chat_reasoning_none / gpt5_chat_reasoning_low; official values none|low|medium|high|xhigh (model-dependent)" }
      response_format: { coverage: "gpt5_chat_json" }
      tools: { coverage: "gpt5_chat_tools" }
      tool_choice: { coverage: "gpt5_chat_tools; use required and omit reasoning_effort on Chat Completions" }
    test_profiles:
      - "gpt5_chat_stream"
      - "gpt5_chat_stream_usage"
      - "gpt5_chat_max_completion_tokens"
      - "gpt5_chat_reasoning_none"
      - "gpt5_chat_reasoning_low"
      - "gpt5_chat_json"
      - "gpt5_chat_tools"

  openai_gpt56_chat:
    label: "OpenAI GPT-5.6 Chat Completions"
    model_family: gpt
    api_form: openai_chat_completions
    route_profile: vendor_direct
    official_sources:
      - "https://developers.openai.com/api/docs/models/gpt-5.6-sol"
      - "https://developers.openai.com/api/docs/guides/model-guidance?model=gpt-5.6"
      - "https://platform.openai.com/docs/api-reference/chat/create"
    families:
      - "gpt"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "gpt5_chat_stream / gpt5_chat_stream_usage" }
      stream_options.include_usage: { coverage: "gpt5_chat_stream_usage" }
      max_completion_tokens: { coverage: "all profiles" }
      reasoning_effort: { coverage: "gpt5_chat_reasoning_none / gpt5_chat_reasoning_low / gpt5_chat_reasoning_medium / gpt5_chat_reasoning_high / gpt5_chat_reasoning_xhigh / gpt5_chat_reasoning_max / gpt5_chat_tools; GPT-5.6 values none|low|medium|high|xhigh|max" }
      response_format: { coverage: "gpt5_chat_json" }
      tools: { coverage: "gpt5_chat_tools; official Chat Completions tool path requires effective reasoning_effort=none" }
      tool_choice: { coverage: "gpt5_chat_tools" }
      temperature: { supported: false, coverage: "gpt5_chat_reject_temperature; non-default sampling is rejected" }
      stop: { supported: false, coverage: "gpt5_chat_reject_stop" }
    test_profiles:
      - "gpt5_chat_stream"
      - "gpt5_chat_stream_usage"
      - "gpt5_chat_max_completion_tokens"
      - "gpt5_chat_reasoning_none"
      - "gpt5_chat_reasoning_low"
      - "gpt5_chat_reasoning_medium"
      - "gpt5_chat_reasoning_high"
      - "gpt5_chat_reasoning_xhigh"
      - "gpt5_chat_reasoning_max"
      - "gpt5_chat_json"
      - "gpt5_chat_tools"
      - "gpt5_chat_reject_temperature"
      - "gpt5_chat_reject_stop"

  openai_responses:
    label: "OpenAI Responses API"
    model_family: gpt
    api_form: openai_responses
    route_profile: vendor_direct
    official_sources:
      - "https://developers.openai.com/api/reference/resources/responses"
      - "https://developers.openai.com/api/docs/guides/migrate-to-responses"
      - "https://developers.openai.com/api/docs/guides/reasoning"
    families:
      - "gpt"
    params:
      model: { required: true, coverage: "provider/model selection" }
      input: { required: true, coverage: "all profiles" }
      instructions: { coverage: "openai_responses_instructions" }
      stream: { coverage: "openai_responses_stream / openai_responses_stream_usage" }
      max_output_tokens: { coverage: "openai_responses_basic / openai_responses_reasoning / openai_responses_json / openai_responses_tools" }
      reasoning.effort: { coverage: "openai_responses_reasoning / openai_responses_basic; official values none|low|medium|high|xhigh|max (model-dependent)" }
      store: { coverage: "openai_responses_store_false" }
      text.format: { coverage: "openai_responses_json" }
      tools: { coverage: "openai_responses_tools" }
      tool_choice: { coverage: "openai_responses_tools" }
    test_profiles:
      - "openai_responses_basic"
      - "openai_responses_instructions"
      - "openai_responses_stream"
      - "openai_responses_stream_usage"
      - "openai_responses_reasoning"
      - "openai_responses_json"
      - "openai_responses_store_false"
      - "openai_responses_tools"

  openai_gpt56_responses:
    label: "OpenAI GPT-5.6 Responses API"
    model_family: gpt
    api_form: openai_responses
    route_profile: vendor_direct
    official_sources:
      - "https://developers.openai.com/api/docs/models/gpt-5.6-sol"
      - "https://developers.openai.com/api/docs/guides/model-guidance?model=gpt-5.6"
      - "https://developers.openai.com/api/reference/resources/responses"
    families:
      - "gpt"
    params:
      model: { required: true, coverage: "provider/model selection" }
      input: { required: true, coverage: "all profiles" }
      instructions: { coverage: "openai_responses_instructions" }
      stream: { coverage: "openai_responses_stream / openai_responses_stream_usage" }
      max_output_tokens: { coverage: "all profiles" }
      reasoning.effort: { coverage: "openai_responses_reasoning_none / openai_responses_reasoning_low / openai_responses_reasoning / openai_responses_reasoning_high / openai_responses_reasoning_xhigh / openai_responses_reasoning_max / openai_responses_reasoning_context_all_turns / openai_responses_reasoning_context_current_turn / openai_responses_pro_medium" }
      reasoning.context: { coverage: "openai_responses_reasoning_context_all_turns / openai_responses_reasoning_context_current_turn" }
      reasoning.mode: { coverage: "openai_responses_pro_medium" }
      prompt_cache_key: { coverage: "openai_responses_explicit_cache" }
      prompt_cache_options.mode: { coverage: "openai_responses_explicit_cache" }
      prompt_cache_options.ttl: { coverage: "openai_responses_explicit_cache" }
      text.verbosity: { coverage: "openai_responses_verbosity" }
      text.format: { coverage: "openai_responses_json" }
      store: { coverage: "openai_responses_store_false" }
      tools: { coverage: "openai_responses_tools" }
      tool_choice: { coverage: "openai_responses_tools" }
    test_profiles:
      - "openai_responses_basic"
      - "openai_responses_instructions"
      - "openai_responses_stream"
      - "openai_responses_stream_usage"
      - "openai_responses_reasoning_none"
      - "openai_responses_reasoning_low"
      - "openai_responses_reasoning"
      - "openai_responses_reasoning_high"
