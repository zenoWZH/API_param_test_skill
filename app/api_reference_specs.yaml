      - "openai_responses_json"
      - "openai_responses_store_false"
      - "openai_responses_tools"

  # xAI Grok Chat Completions (legacy but still documented).
  # Reasoning models reject stop / presence_penalty / frequency_penalty.
  # grok-4.5: reasoning_effort low|medium|high (default high; cannot disable).
  # Prefer max_completion_tokens over max_tokens for output budget.
  # Preferred for xAI. Chat Completions remains available as grok_chat_completions.
  # multi-agent models require this transport (chat returns 400).
  grok_responses:
    label: "xAI Grok Responses"
    model_family: grok
    api_form: openai_responses
    route_profile: vendor_direct
    official_sources:
      - "https://docs.x.ai/developers/model-capabilities/text/generate-text"
      - "https://docs.x.ai/developers/model-capabilities/text/reasoning"
      - "https://docs.x.ai/developers/model-capabilities/text/comparison"
      - "https://docs.x.ai/developers/grok-4-5"
    default_for_families:
      - "grok"
    params:
      input: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      instructions: { coverage: "grok_responses_instructions" }
      stream: { coverage: "grok_responses_stream / grok_responses_stream_usage" }
      max_output_tokens: { coverage: "grok_responses_basic / grok_responses_reasoning_* / grok_responses_json / grok_responses_tools" }
      reasoning.effort: { coverage: "grok_responses_reasoning_low / grok_responses_reasoning_medium / grok_responses_reasoning_high / grok_responses_reasoning_effort_none; grok-4.5 values low|medium|high (cannot disable); multi-agent also uses effort for agent count" }
      store: { coverage: "grok_responses_store_false" }
      text.format: { coverage: "grok_responses_json" }
      tools: { coverage: "grok_responses_tools" }
      tool_choice: { coverage: "grok_responses_tools" }
      stop: { coverage: "not tested on Responses; xAI accepts/ignores stop here — use grok_chat_completions reject probes" }
    test_profiles:
      - "grok_responses_basic"
      - "grok_responses_instructions"
      - "grok_responses_stream"
      - "grok_responses_stream_usage"
      - "grok_responses_reasoning_low"
      - "grok_responses_reasoning_medium"
      - "grok_responses_reasoning_high"
      - "grok_responses_reasoning_effort_none"
      - "grok_responses_json"
      - "grok_responses_store_false"
      - "grok_responses_tools"

  grok_chat_completions:
    label: "xAI Grok Chat Completions"
    model_family: grok
    api_form: openai_chat_completions
    route_profile: vendor_direct
    official_sources:
      - "https://docs.x.ai/developers/rest-api-reference/inference/chat"
      - "https://docs.x.ai/developers/model-capabilities/text/reasoning"
      - "https://docs.x.ai/developers/grok-4-5"
      - "https://docs.x.ai/developers/model-capabilities/legacy/chat-completions"
    # Optional legacy source; default for family grok is grok_responses.
    families:
      - "grok"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "grok_stream / grok_stream_usage" }
      stream_options.include_usage: { coverage: "grok_stream_usage" }
      max_completion_tokens: { coverage: "grok_max_completion_tokens / grok_reasoning_effort_* / grok_json / grok_tools" }
      reasoning_effort: { coverage: "grok_reasoning_effort_low / grok_reasoning_effort_medium / grok_reasoning_effort_high / grok_reasoning_effort_none; official values low|medium|high (grok-4.5 cannot disable / rejects none)" }
      response_format: { coverage: "grok_json" }
      tools: { coverage: "grok_tools" }
      tool_choice: { coverage: "grok_tools" }
      stop: { coverage: "grok_reject_stop; rejected on reasoning models such as grok-4.5" }
      presence_penalty: { coverage: "grok_reject_presence_penalty; rejected on reasoning models" }
      frequency_penalty: { coverage: "not tested; rejected on reasoning models" }
    test_profiles:
      - "grok_stream"
      - "grok_stream_usage"
      - "grok_max_completion_tokens"
      - "grok_reasoning_effort_low"
      - "grok_reasoning_effort_medium"
      - "grok_reasoning_effort_high"
      - "grok_reasoning_effort_none"
      - "grok_json"
      - "grok_tools"
      - "grok_reject_stop"
      - "grok_reject_presence_penalty"

  glm_openai_compat:
    label: "GLM-5.2 Chat Completions"
    model_family: glm
    api_form: openai_chat_completions
    route_profile: vendor_direct
    official_sources:
      - "https://docs.bigmodel.cn/api-reference/模型-api/对话补全"
      - "https://docs.bigmodel.cn/cn/guide/develop/openai/introduction"
      - "https://docs.bigmodel.cn/cn/guide/start/concept-param"
      - "https://docs.bigmodel.cn/cn/guide/start/migrate-to-glm-new"
      - "https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode"
      - "https://docs.bigmodel.cn/cn/guide/capabilities/stream-tool"
    default_for_families:
      - "glm"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "basic_stream" }
      thinking.type: { coverage: "glm_thinking_enabled / glm_thinking_disabled" }
      thinking.clear_thinking: { coverage: "glm_clear_thinking / glm_tool_calls_thinking; false enables preserved/interleaved thinking" }
      reasoning_effort: { coverage: "glm_reasoning_none / glm_reasoning_minimal / glm_reasoning_low / glm_reasoning_medium / glm_reasoning_high / glm_reasoning_xhigh / glm_reasoning_max / glm_tool_calls_thinking" }
      do_sample: { coverage: "glm_do_sample" }
      temperature: { coverage: "glm_temperature" }
      top_p: { coverage: "glm_top_p" }
      max_tokens: { coverage: "glm_max_tokens" }
      tool_stream: { coverage: "glm_tool_stream" }
      tools: { coverage: "glm_tools / glm_tool_stream / glm_tool_calls_thinking" }
      tool_choice: { coverage: "glm_tool_choice_auto / glm_tool_stream / glm_tool_calls_thinking; official value: auto" }
      stop: { coverage: "stop_sequences" }
      response_format: { coverage: "json_output" }
      request_id: { coverage: "glm_request_id" }
      user_id: { coverage: "glm_user_id" }
      response.reasoning_content: { coverage: "glm_thinking_enabled / glm_thinking_disabled / glm_reasoning_none / glm_reasoning_minimal / glm_reasoning_low / glm_reasoning_medium / glm_reasoning_high / glm_reasoning_xhigh / glm_reasoning_max / glm_tool_calls_thinking" }
    test_profiles:
      - "basic_stream"
      - "glm_thinking_enabled"
      - "glm_thinking_disabled"
      - "glm_clear_thinking"
      - "glm_reasoning_none"
      - "glm_reasoning_minimal"
      - "glm_reasoning_low"
      - "glm_reasoning_medium"
      - "glm_reasoning_high"
      - "glm_reasoning_xhigh"
      - "glm_reasoning_max"
      - "glm_do_sample"
      - "glm_temperature"
      - "glm_top_p"
      - "glm_max_tokens"
      - "glm_tool_stream"
      - "glm_tools"
      - "glm_tool_choice_auto"
      - "glm_tool_calls_thinking"
      - "json_output"
      - "stop_sequences"
      - "glm_request_id"
      - "glm_user_id"

  qwen_openai_compat:
    label: "Qwen DashScope OpenAI-compatible Chat Completions (官方原生扩展)"
    model_family: qwen
    api_form: openai_chat_completions
    route_profile: aliyun_maas
    official_sources:
      - "https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions"
      - "https://help.aliyun.com/zh/model-studio/deep-thinking"
      - "https://help.aliyun.com/zh/model-studio/qwen3-7-max"
      - "https://help.aliyun.com/zh/model-studio/qwen-structured-output"
      - "https://help.aliyun.com/zh/model-studio/models"
    default_for_families:
      - "qwen"
    params:
      messages: { required: true, coverage: "all profiles" }
      model: { required: true, coverage: "provider/model selection" }
      stream: { coverage: "basic_stream / stream_with_usage / qwen_thinking_enabled / qwen_thinking_budget / qwen_preserve_thinking / qwen_tool_stream / qwen_enable_code_interpreter" }
      stream_options.include_usage: { coverage: "stream_with_usage" }
      max_tokens: { coverage: "qwen_max_tokens / qwen_n / qwen_logprobs; deprecated in favor of max_completion_tokens" }
      max_completion_tokens: { coverage: "qwen_max_completion_tokens / qwen_thinking_enabled / qwen_thinking_budget / qwen_preserve_thinking" }
      stop: { coverage: "stop_sequences" }
      temperature: { coverage: "qwen_temperature" }
