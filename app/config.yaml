    extends: kimi_k3_defaults
    reasoning_effort: high
  kimi_k3_reasoning_max:
    extends: kimi_k3_defaults
    reasoning_effort: max
  kimi_k3_preserved_thinking:
    extends: kimi_k3_defaults
    messages:
      - role: user
        content: "Tell me three random numbers."
      - role: assistant
        reasoning_content: "I'll start by listing five numbers: 473, 921, 235, 215, 222, and I'll tell you the first three."
        content: "473, 921, 235"
      - role: user
        content: "What are the other two numbers you have in mind? Reply with only those two numbers."
  kimi_k3_prompt_cache_key:
    extends: kimi_k3_defaults
    prompt_cache_key: "loadtest-kimi-k3-session-v1"
  kimi_k3_dynamic_tools:
    extends: kimi_k3_defaults
    tool_choice: required
    messages:
      - role: system
        content: ""
        tools:
          - type: function
            function:
              name: get_weather
              description: "Get the weather of a city."
              parameters:
                type: object
                properties:
                  city:
                    type: string
                required: [city]
      - role: user
        content: "What is the weather in Beijing? Use the available tool."
  # Official K3 verifier negative controls: these values must be rejected.
  kimi_k3_reject_temperature:
    extends: kimi_k3_defaults
    temperature: 1.1
  kimi_k3_reject_top_p:
    extends: kimi_k3_defaults
