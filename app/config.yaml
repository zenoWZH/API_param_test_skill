api:
  base_url: "https://yibuapi.com/v1"
  timeout_sec: 300

active_provider: yibu

providers:
  yibu:
    label: "YibuAPI"
    base_url: "https://yibuapi.com/v1"
    backend: openai_compatible
    default_transport: chat_completions
    api_interfaces:
      chat_completions:
        path: /chat/completions
        auth: bearer
    api_key_env: "YIBU_API_KEY"
    models:
      default: "deepseek-v4-pro"
      candidates:
        - "deepseek-v4-flash"
        - "deepseek-v4-pro"
        - "glm-5.2"
      families:
        deepseek-v4-flash: deepseek
        deepseek-v4-pro: deepseek
        glm-5.2: glm
      routes:
        deepseek-v4-flash:
          dynamic_aggregator:
            api_forms:
              openai_chat_completions: {}
        deepseek-v4-pro:
          dynamic_aggregator:
            api_forms:
              openai_chat_completions: {}
        glm-5.2:
          dynamic_aggregator:
            api_forms:
              openai_chat_completions: {}
      default_routes:
        deepseek-v4-flash: dynamic_aggregator
        deepseek-v4-pro: dynamic_aggregator
        glm-5.2: dynamic_aggregator
      default_api_forms:
        deepseek-v4-flash:
          dynamic_aggregator: openai_chat_completions
        deepseek-v4-pro:
          dynamic_aggregator: openai_chat_completions
        glm-5.2:
          dynamic_aggregator: openai_chat_completions
      # Only explicit aliases are trusted by model identity auditing.
      identity_aliases: {}
      # Optional per-model exact counters; see README token audit section.
      token_counters: {}
  gemini:
    label: "Google Gemini Direct (needs GEMINI_API_KEY)"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    backend: gemini_ai_studio
    default_transport: chat_completions
    api_interfaces:
      chat_completions:
        path: /chat/completions
        auth: bearer
      gemini_generate_content:
        base_url: https://generativelanguage.googleapis.com/v1beta
        path: /models/{model}:generateContent
        auth: google_api_key
      gemini_interactions:
        base_url: https://generativelanguage.googleapis.com
        path: /v1beta/interactions
        auth: google_api_key
    api_key_env: "GEMINI_API_KEY"
    models:
      default: "gemini-2.5-flash"
      candidates:
        - "gemini-3.5-flash"
        - "gemini-3-flash-preview"
        - "gemini-3.1-pro-preview"
        - "gemini-3.1-pro-preview-customtools"
        - "gemini-3.1-flash-lite"
        - "gemini-2.5-flash"
        - "gemini-2.5-pro"
        - "gemini-2.5-flash-lite"
      families:
        gemini-3.5-flash: gemini
        gemini-3-flash-preview: gemini
        gemini-3.1-pro-preview: gemini
        gemini-3.1-pro-preview-customtools: gemini
        gemini-3.1-flash-lite: gemini
        gemini-2.5-flash: gemini
        gemini-2.5-pro: gemini
        gemini-2.5-flash-lite: gemini
      routes:
        gemini-3.5-flash: &gemini_text_routes
          google_ai_studio:
            api_forms:
              openai_chat_completions: {}
              gemini_generate_content: {}
        gemini-3-flash-preview: *gemini_text_routes
        gemini-3.1-pro-preview: *gemini_text_routes
        gemini-3.1-pro-preview-customtools: *gemini_text_routes
        gemini-3.1-flash-lite: *gemini_text_routes
        gemini-2.5-flash: *gemini_text_routes
        gemini-2.5-pro: *gemini_text_routes
        gemini-2.5-flash-lite: *gemini_text_routes
      default_routes:
        gemini-3.5-flash: google_ai_studio
        gemini-3-flash-preview: google_ai_studio
        gemini-3.1-pro-preview: google_ai_studio
        gemini-3.1-pro-preview-customtools: google_ai_studio
        gemini-3.1-flash-lite: google_ai_studio
        gemini-2.5-flash: google_ai_studio
        gemini-2.5-pro: google_ai_studio
        gemini-2.5-flash-lite: google_ai_studio
      default_api_forms:
        gemini-3.5-flash: &gemini_text_default_forms
          google_ai_studio: openai_chat_completions
        gemini-3-flash-preview: *gemini_text_default_forms
        gemini-3.1-pro-preview: *gemini_text_default_forms
        gemini-3.1-pro-preview-customtools: *gemini_text_default_forms
        gemini-3.1-flash-lite: *gemini_text_default_forms
        gemini-2.5-flash: *gemini_text_default_forms
        gemini-2.5-pro: *gemini_text_default_forms
        gemini-2.5-flash-lite: *gemini_text_default_forms
      identity_aliases: {}
      token_counters: {}
    image:
      enabled: true
      default: gemini-3.1-flash-image
      models:
        - id: gemini-3.1-flash-image
          family: banana
          routes:
            google_ai_studio:
              api_forms:
                gemini_interactions:
                  transport: gemini-interactions
          default_route_profile: google_ai_studio
          default_api_forms:
            google_ai_studio: gemini_interactions

models:
  default: "deepseek-v4-pro"
  candidates: ["deepseek-v4-flash", "deepseek-v4-pro", "glm-5.2"]

prompts:
  short: "用一句话介绍你自己。"
  medium: "列出 3 个 Python 性能优化技巧，每条不超过 20 字。"
  streaming_latency_api: "请用约一百个汉字说明如何观测流式大模型 API 的性能，分成四个长度相近的要点，不要使用表格。"
  streaming_latency_load: "请用约一百个汉字说明如何定位大模型 API 的压测瓶颈，分成四个长度相近的要点，不要使用表格。"
  streaming_latency_cache: "请用约一百个汉字说明如何评估大模型上下文缓存效果，分成四个长度相近的要点，不要使用表格。"

param_test_inputs:
  general:
    - id: intro
      prompt: "用一句话介绍你自己。"
    - id: python_perf
      prompt: "列出 3 个 Python 性能优化技巧，每条不超过 20 字。"
    - id: api_loadtest
      prompt: "用两句话解释 API 压测为什么要区分业务请求和控制请求。"
    - id: streaming_checks
      prompt: "列出流式响应兼容性测试中最重要的三个检查点。"
    - id: cache_metric
      prompt: "用一句话说明上下文缓存命中率应该如何解读。"
  reasoning:
    - id: decimal_compare
      prompt: "请先分析再回答：9.11 和 9.8 哪个更大？说明小数位对齐过程。"
    - id: arithmetic_chain
      prompt: "请逐步计算并核验：(17 × 23) - (19 × 11) 的结果。"
    - id: logic_order
      prompt: "甲比乙早到，丙比甲晚到但比乙早到。请分析三人的到达顺序。"
  json_output:
    - id: json_python_perf
      prompt: "请只返回一个合法 JSON object，不要输出 Markdown。JSON 需要包含字段 summary 和 items。主题：总结 Python 性能优化的三个方向。"
    - id: json_api_latency
      prompt: "请只返回 JSON object，字段包含 summary 和 items。主题：总结 API 延迟优化的三个要点。"
    - id: json_cache
      prompt: "请输出合法 JSON object，不要输出 Markdown。字段包含 summary 和 items。主题：列出上下文缓存观测的三个注意事项。"
  tool_calls:
    - id: weather_beijing
      prompt: "请调用 get_weather 查询北京当前天气，单位使用 celsius。"
    - id: weather_shanghai
      prompt: "请调用 get_weather 查询上海当前天气，单位使用 celsius。"
    - id: weather_hangzhou
      prompt: "请调用 get_weather 查询杭州当前天气，单位使用 celsius。"

test_cases:
  # Short chat/native prompts receive deterministic numeric context so every
  # generated test request has at least this many input tokens.
  minimum_prompt_tokens: 100
  token_accuracy:
    enabled: true
    evidence_policy: exact_only
    relative_tolerance: 0.50
    input_absolute_tolerance: 16
    output_absolute_tolerance: 8
    counters: {}

thresholds:
  smoke:
    success_rate_min: 1.0
  staircase:
    success_rate_min: 0.99
    p95_latency_max_ms: 30000
    error_429_max_ratio: 0.01
    error_5xx_max_ratio: 0.01
    target_business_rpm_min: 1000
    target_total_tpm_min: 0
    count_profile_group: throughput_profiles
    exclude_task_names:
      - "control:list_models"
      - "warmup:*"
  soak_1h:
    success_rate_min: 0.98
    p95_latency_max_ms: 45000
    error_429_max_ratio: 0.02
    error_5xx_max_ratio: 0.01
    rpm_drift_max_ratio: 0.20
  cache:
    mode: observe
    require_usage_fields: true
    positive_control_cached_ratio_min: 0.50
    negative_control_cached_ratio_max: 0.05

warmup:
  enabled: true
  duration: "1m"
  users: 10
  workload: "throughput_rpm"
  exclude_from_verdict: true

metrics:
  history_interval_sec: 60
  live_chart_interval_sec: 10
  history_file: "history.jsonl"
  records_file: "request_records.jsonl"
  business_request_prefix: "chat:"
  cache_min_prompt_tokens: 4000
  failure_finish_reasons:
    - "insufficient_system_resource"
  warn_finish_reasons:
    - "content_filter"

adaptive_load:
  # Enabled automatically when both target RPM and target TPM are positive.
  # Average total tokens/request = target TPM / target RPM.
  filter_context_unsafe_profiles: true
  corpus_fixtures:
    - "fixtures/long_context.txt"
    - "fixtures/half_million_context.txt"
  fallback_context_window_tokens: 131072
  context_safety_ratio: 0.95
  minimum_user_prompt_tokens: 100
  initial_completion_tokens: 64
  ema_alpha: 0.20
  tolerance_ratio: 0.10
  min_samples: 20
  usage_coverage_warn_below: 0.90
  bands:
    - name: short
      ratio: 0.5
      weight: 25
    - name: target
      ratio: 1.0
      weight: 50
    - name: long
      ratio: 1.5
      weight: 25

staircase:
  workload: "throughput"
  spawn_rate: 5
  step_duration: "5m"
  steps:
    - users: 10
    - users: 30
    - users: 60
    - users: 100
    - users: 150
  auto_extend:
    enabled: true
    increment_users: 30
    max_users: 300

soak:
  workload: "throughput"
  duration: "1h"
  users: 80
  spawn_rate: 5

cache_test:
  mode: "cache_suite"
  scenario: "progressive_customer_session"
  stable_system: "你是企业客服助手。回答应准确、简洁；需要外部信息时调用提供的工具，不要编造工具结果。"
  sessions: 10
  rounds_per_session: 4
  content_profile: "realistic"
  content_profiles:
    small:
      user_chars: {min: 100, max: 400}
      tool_result_chars: {min: 300, max: 1000}
    realistic:
      user_chars: {min: 200, max: 2000}
      tool_result_chars: {min: 500, max: 5000}
    large:
      user_chars: {min: 1000, max: 4000}
      tool_result_chars: {min: 3000, max: 10000}
  tool_stage:
    enabled: true
    round: 3
  structure_probe:
    enabled: true
  controls:
    mode: "auto"
    auto_positive_long_prefix_pairs: 3
    auto_negative_unique_prefix_requests: 3
  wait_after_seed_sec: 5
  max_run_seconds: 1800
  consecutive_failure_limit: 3
  seed: 20260715
  evidence_mode: official_usage
  fixture: "fixtures/long_context.txt"
  max_tokens: 128
  diagnostic_defaults:
    kilocode_agent_session:
      steps: 20
      trajectory_mode: scripted
      warmup_requests: 1
      wait_after_seed_sec: 5
      controls:
        positive_long_prefix_pairs: 3
        negative_unique_prefix_requests: 3
      thresholds:
        mode: gate
        cached_input_token_ratio_min: 0.90
        measurement_coverage_min: 0.90
        positive_control_cached_ratio_min: 0.50
        negative_control_cached_ratio_max: 0.10
    growing_conversation:
      warmup_requests: 2
      wait_after_warmup_sec: 5
      measured_requests: 50
      assistant_history_max_chars: 1000
    shared_prefix:
      warmup_requests: 2
      wait_after_warmup_sec: 5
      measured_requests: 50
  detect:
    prefer_official_usage: true
    header_names:
      - "x-cache"
      - "cf-cache-status"
      - "x-oneapi-cache"
    latency_fallback: true

deepseek_params:
  allow_deprecated: false
  default:
    max_tokens: 128
    thinking:
