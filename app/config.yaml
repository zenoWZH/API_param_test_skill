api:
  base_url: "https://yibuapi.com/v1"
  timeout_sec: 300

active_provider: yibu

providers:
  yibu:
    label: "YibuAPI"
    base_url: "https://yibuapi.com/v1"
    backend: openai_compatible
    default_transport: chat_completions
    api_interfaces:
      chat_completions:
        path: /chat/completions
        auth: bearer
    api_key_env: "YIBU_API_KEY"
    models:
      default: "deepseek-v4-pro"
      candidates:
        - "deepseek-v4-flash"
        - "deepseek-v4-pro"
        - "glm-5.2"
      families:
        deepseek-v4-flash: deepseek
        deepseek-v4-pro: deepseek
        glm-5.2: glm
      routes:
        deepseek-v4-flash:
          dynamic_aggregator:
            api_forms:
              openai_chat_completions: {}
        deepseek-v4-pro:
          dynamic_aggregator:
            api_forms:
              openai_chat_completions: {}
        glm-5.2:
          dynamic_aggregator:
            api_forms:
              openai_chat_completions: {}
      default_routes:
        deepseek-v4-flash: dynamic_aggregator
        deepseek-v4-pro: dynamic_aggregator
        glm-5.2: dynamic_aggregator
      default_api_forms:
        deepseek-v4-flash:
          dynamic_aggregator: openai_chat_completions
        deepseek-v4-pro:
          dynamic_aggregator: openai_chat_completions
        glm-5.2:
          dynamic_aggregator: openai_chat_completions
      # Only explicit aliases are trusted by model identity auditing.
      identity_aliases: {}
      # Optional per-model exact counters; see README token audit section.
      token_counters: {}
  deepseek_official:
    label: "DeepSeek official"
    reference_source_id: deepseek
    base_url: "https://api.deepseek.com"
    backend: openai_compatible
    default_transport: fim_completions
    api_interfaces:
      chat_completions:
        path: /chat/completions
        auth: bearer
      openai_responses:
        path: /responses
        auth: bearer
      claude_messages:
        base_url: "https://api.deepseek.com/anthropic"
        path: /v1/messages
        auth: anthropic
      fim_completions:
        base_url: "https://api.deepseek.com/beta"
        path: /completions
        auth: bearer
      deepseek-beta-chat-prefix:
        path: /beta/chat/completions
        auth: bearer
    api_key_env: "DEEPSEEK_API_KEY"
    models:
      default: "deepseek-v4-pro"
      candidates:
        - "deepseek-v4-pro"
        - "deepseek-flash"
      families:
        deepseek-flash: deepseek
        deepseek-v4-pro: deepseek
      routes:
        deepseek-flash:
          vendor_direct:
            api_forms:
              openai_chat_completions:
                reference_contract_id: deepseek_v4_1_flash_chat
              openai_responses:
                reference_contract_id: deepseek_v4_1_flash_responses
              anthropic_messages:
                reference_contract_id: deepseek_v4_1_flash_anthropic
              deepseek_beta_chat_prefix:
                reference_contract_id: deepseek_v4_1_flash_chat_prefix_beta
              openai_fim_completions_beta:
                reference_contract_id: deepseek_v4_1_flash_fim_beta
        deepseek-v4-pro:
          vendor_direct:
            api_forms:
              openai_chat_completions:
                reference_contract_id: deepseek_v4_pro_0813_chat
              openai_responses:
                reference_contract_id: deepseek_v4_pro_0813_responses
              anthropic_messages:
                reference_contract_id: deepseek_v4_pro_0813_anthropic
              openai_fim_completions_beta:
                reference_contract_id: deepseek_v4_pro_0813_fim_beta
              deepseek_beta_chat_prefix:
                reference_contract_id: deepseek_v4_pro_0813_chat_prefix_beta
      default_routes:
        deepseek-flash: vendor_direct
        deepseek-v4-pro: vendor_direct
      default_api_forms:
        deepseek-flash:
          vendor_direct: openai_chat_completions
        deepseek-v4-pro:
          vendor_direct: openai_fim_completions_beta
      reference_source_ids:
        deepseek-flash: deepseek
        deepseek-v4-pro: deepseek
      reference_model_ids:
        deepseek-flash: deepseek-flash
        deepseek-v4-pro: deepseek-v4-pro
      identity_aliases: {}
      token_counters: {}
  gemini:
    label: "Google Gemini Direct (needs GEMINI_API_KEY)"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    backend: gemini_ai_studio
    default_transport: chat_completions
    api_interfaces:
      chat_completions:
        path: /chat/completions
        auth: bearer
      gemini_generate_content:
        base_url: https://generativelanguage.googleapis.com
        path: /v1beta/models/{model}:generateContent
        auth: google_api_key
        default_api_version: v1beta
        api_versions:
          v1beta: {stability: beta, path: "/v1beta/models/{model}:generateContent"}
      gemini_interactions:
        base_url: https://generativelanguage.googleapis.com
        path: /v1beta/interactions
        auth: google_api_key
        default_api_version: v1beta
        api_versions:
          v1beta: {stability: beta, path: /v1beta/interactions}
      token_count:
        base_url: https://generativelanguage.googleapis.com
        path: /v1beta/models/{model}:countTokens
        auth: google_api_key
        transports: [gemini_generate_content]
        request_wrapper: generateContentRequest
        request_model_field: model
        response_field: totalTokens
    api_key_env: "GEMINI_API_KEY"
    models:
      default: "gemini-2.5-flash"
      candidates:
        - "gemini-3.7-flash"
        - "gemini-3.6-flash"
        - "gemini-3.5-flash"
        - "gemini-3.5-flash-lite"
        - "gemini-3-flash-preview"
        - "gemini-3.1-pro-preview"
        - "gemini-3.1-pro-preview-customtools"
        - "gemini-3.1-flash-lite"
        - "gemini-2.5-flash"
        - "gemini-2.5-pro"
        - "gemini-2.5-flash-lite"
      families:
        gemini-3.7-flash: gemini
        gemini-3.6-flash: gemini
        gemini-3.5-flash: gemini
        gemini-3.5-flash-lite: gemini
        gemini-3-flash-preview: gemini
        gemini-3.1-pro-preview: gemini
        gemini-3.1-pro-preview-customtools: gemini
        gemini-3.1-flash-lite: gemini
        gemini-2.5-flash: gemini
        gemini-2.5-pro: gemini
        gemini-2.5-flash-lite: gemini
      routes:
        gemini-3.7-flash:
          google_ai_studio:
            api_forms:
              gemini_generate_content:
                reference_contract_id: gemini_3_7_flash_generate_content
              gemini_interactions:
                reference_contract_id: gemini_3_7_flash_interactions
        # Public source mappings needed by the optional media workflows. Only
        # the registered Chat interface is imported; native gates stay intact.
        gemini-3.6-flash: &gemini_media_chat_route
          google_ai_studio:
            api_forms:
              openai_chat_completions:
                reference_contract_id: gemini_openai_compat
        gemini-3.5-flash-lite: *gemini_media_chat_route
        gemini-3.5-flash: &gemini_text_routes
          google_ai_studio:
            api_forms:
              openai_chat_completions: {}
              gemini_generate_content: {}
        gemini-3-flash-preview: *gemini_text_routes
        gemini-3.1-pro-preview: *gemini_text_routes
        gemini-3.1-pro-preview-customtools: *gemini_text_routes
        gemini-3.1-flash-lite: *gemini_text_routes
        gemini-2.5-flash: *gemini_text_routes
        gemini-2.5-pro: *gemini_text_routes
        gemini-2.5-flash-lite: *gemini_text_routes
      default_routes:
        gemini-3.7-flash: google_ai_studio
        gemini-3.6-flash: google_ai_studio
        gemini-3.5-flash: google_ai_studio
        gemini-3.5-flash-lite: google_ai_studio
        gemini-3-flash-preview: google_ai_studio
        gemini-3.1-pro-preview: google_ai_studio
        gemini-3.1-pro-preview-customtools: google_ai_studio
        gemini-3.1-flash-lite: google_ai_studio
        gemini-2.5-flash: google_ai_studio
        gemini-2.5-pro: google_ai_studio
        gemini-2.5-flash-lite: google_ai_studio
      default_api_forms:
        gemini-3.7-flash:
          google_ai_studio: gemini_generate_content
        gemini-3.5-flash: &gemini_text_default_forms
          google_ai_studio: openai_chat_completions
        gemini-3.6-flash: *gemini_text_default_forms
        gemini-3.5-flash-lite: *gemini_text_default_forms
        gemini-3-flash-preview: *gemini_text_default_forms
        gemini-3.1-pro-preview: *gemini_text_default_forms
        gemini-3.1-pro-preview-customtools: *gemini_text_default_forms
        gemini-3.1-flash-lite: *gemini_text_default_forms
        gemini-2.5-flash: *gemini_text_default_forms
        gemini-2.5-pro: *gemini_text_default_forms
        gemini-2.5-flash-lite: *gemini_text_default_forms
      identity_aliases: {}
      token_counters: {}
    image:
      enabled: true
      default: gemini-3.1-flash-image
      models:
        - id: gemini-3.1-flash-image
          family: banana
          routes: &banana_aistudio_interactions
            google_ai_studio:
              api_forms:
                gemini_interactions:
                  transport: gemini-interactions
                gemini_generate_content:
                  transport: gemini-generate-content
          default_route_profile: google_ai_studio
          default_api_forms: &banana_aistudio_default_forms
            google_ai_studio: gemini_interactions
        - id: gemini-3.1-flash-lite-image
          family: banana
          routes:
            google_ai_studio:
              api_forms:
                gemini_interactions:
                  transport: gemini-interactions
                gemini_generate_content:
                  transport: gemini-generate-content
          default_route_profile: google_ai_studio
          default_api_forms:
            google_ai_studio: gemini_generate_content
        - id: gemini-3-pro-image
          family: banana
          routes: *banana_aistudio_interactions
          default_route_profile: google_ai_studio
          default_api_forms: *banana_aistudio_default_forms
        - id: gemini-2.5-flash-image
          family: banana
          routes: *banana_aistudio_interactions
          default_route_profile: google_ai_studio
          default_api_forms: *banana_aistudio_default_forms

