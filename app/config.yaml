  # Kimi K3 official OpenAI-compatible contract. Every positive probe fixes
  # sampling to temperature=1.0/top_p=0.95 and explicitly selects an effort so
  # different vendors receive the same K3 request rather than generic OpenAI
  # sampling defaults.
  kimi_k3_defaults:
    stream: false
    temperature: 1.0
    top_p: 0.95
    max_completion_tokens: 512
    reasoning_effort: max
  kimi_k3_stream:
    extends: kimi_k3_defaults
    stream: true
