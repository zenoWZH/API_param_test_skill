<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">LLM Loadtest Console 测试入口示意图</title>
  <desc id="desc">展示文字参数、图片参数、压测和 Cache 四个标签，以及推荐的参数、缓存、压测执行顺序。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.panel{fill:#fff;stroke:#d6dbe3;stroke-width:1.5}.soft{fill:#f9fafb;stroke:#d6dbe3}.blue{fill:#2563eb}.green{fill:#ecfdf3;stroke:#9ad7bc}.amber{fill:#fffaeb;stroke:#fdb022}.purple{fill:#f5f3ff;stroke:#c4b5fd}.t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#172033}.h1{font:bold 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#172033}.h2{font:bold 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#172033}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#657188}.white{fill:#fff;font-weight:700}.bold{font-weight:700}.arrow{stroke:#657188;stroke-width:2.5;fill:none;marker-end:url(#head)}.num{fill:#2563eb}.numtext{font:bold 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#657188"/></marker>
  </defs>
  <rect class="bg" width="1440" height="680"/>
  <rect class="panel" x="32" y="24" width="1376" height="632" rx="12"/>
  <text class="h1" x="62" y="64">LLM Loadtest Console</text>
  <text class="small" x="62" y="88">Provider 兼容性、压测和 Cache 观测控制台 · 界面示意图</text>
  <rect class="soft" x="62" y="110" width="1316" height="64" rx="8"/>
  <rect class="blue" x="76" y="121" width="270" height="42" rx="6"/>
  <text class="t white" x="127" y="147">文字参数测试</text>
  <rect class="panel" x="356" y="121" width="270" height="42" rx="6"/>
  <text class="t bold" x="390" y="147">图片（多模态）参数测试</text>
  <rect class="panel" x="636" y="121" width="220" height="42" rx="6"/>
  <text class="t bold" x="728" y="147">压测</text>
  <rect class="panel" x="866" y="121" width="220" height="42" rx="6"/>
  <text class="t bold" x="930" y="147">Cache 测试</text>
  <circle class="num" cx="1180" cy="142" r="15"/><text class="numtext" x="1180" y="142">1</text>
  <text class="small" x="1204" y="146">先选择测试类型</text>

  <text class="h2" x="62" y="218">推荐执行顺序</text>
  <rect class="green" x="62" y="246" width="380" height="260" rx="10"/>
  <circle class="num" cx="92" cy="278" r="16"/><text class="numtext" x="92" y="278">2</text>
  <text class="h2" x="120" y="284">参数测试</text>
  <text class="small" x="86" y="316">确认调用合同、响应语义和可观察身份</text>
  <rect class="panel" x="86" y="340" width="332" height="42" rx="6"/><text class="t" x="102" y="366">Provider → Model → Route</text>
  <rect class="panel" x="86" y="392" width="332" height="42" rx="6"/><text class="t" x="102" y="418">API Form → Reference Source</text>
  <text class="small" x="86" y="460">分别查看 compatibility / token / identity</text>
  <text class="small" x="86" y="482">图片还必须解码并核对数量、格式、像素</text>

  <path class="arrow" d="M450 376 H496"/>
  <rect class="amber" x="504" y="246" width="380" height="260" rx="10"/>
  <circle class="num" cx="534" cy="278" r="16"/><text class="numtext" x="534" y="278">3</text>
  <text class="h2" x="562" y="284">Cache 测试</text>
  <text class="small" x="528" y="316">确认官方 usage、结构上限和统计可信度</text>
  <rect class="panel" x="528" y="340" width="332" height="42" rx="6"/><text class="t" x="544" y="366">客户会话 + 结构探针</text>
  <rect class="panel" x="528" y="392" width="332" height="42" rx="6"/><text class="t" x="544" y="418">正向控制 + 负向控制</text>
  <text class="small" x="528" y="460">不能从延迟推断 cached tokens</text>
  <text class="small" x="528" y="482">先看 coverage，再看 actual rate 和 efficiency</text>

  <path class="arrow" d="M892 376 H938"/>
  <rect class="purple" x="946" y="246" width="432" height="260" rx="10"/>
  <circle class="num" cx="976" cy="278" r="16"/><text class="numtext" x="976" y="278">4</text>
  <text class="h2" x="1004" y="284">压测</text>
  <text class="small" x="970" y="316">从低风险验证逐步进入容量和稳定性测试</text>
  <rect class="panel" x="970" y="340" width="180" height="42" rx="6"/><text class="t" x="1021" y="366">Quick</text>
  <path class="arrow" d="M1158 361 H1192"/>
  <rect class="panel" x="1200" y="340" width="154" height="42" rx="6"/><text class="t" x="1238" y="366">Staircase</text>
  <rect class="panel" x="970" y="392" width="384" height="42" rx="6"/><text class="t" x="1113" y="418">Soak</text>
  <text class="small" x="970" y="460">business RPM + TPM + success + 429/5xx</text>
  <text class="small" x="970" y="482">流式另看 TTFT/TPOT；长跑另看漂移</text>

  <rect class="soft" x="62" y="536" width="1316" height="86" rx="8"/>
  <text class="t bold" x="86" y="568">共同前提</text>
  <text class="small" x="86" y="592">同一模型在不同 Route / API Form 下是不同测试组合；切换 Route 后，表单和历史结果必须重新选择。</text>
  <text class="small" x="86" y="612">图中为当前控件结构示意，不含真实密钥、Provider 私有配置或运行结果。</text>
</svg>
