# Copy to providers.local.yaml for private provider definitions.
# providers.local.yaml is ignored by git.
# Put key values in .env and reference them with api_key_env.
# Global request timeout lives in config.yaml -> api.timeout_sec.
# Jobs started from the web console can override it per run via LOADTEST_TIMEOUT_SEC.

providers:
  yibu:
    api_key_env: "YIBU_API_KEY"
    backend: openai_compatible
    default_transport: chat_completions
    api_interfaces:
      chat_completions:
        path: /chat/completions
        auth: bearer
    # Optional. Adaptive RPM+TPM tests use 131072 as a safe fallback when omitted.
    # models:
    #   context_windows:
    #     deepseek-v4-pro: 131072

